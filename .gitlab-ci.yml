image: node:22-bookworm-slim

stages:
    - build

variables:
    NUXT_APP_BASE_URL: "/greatbay-scie/"
    # NODE_OPTIONS: "--max-old-space-size=1400"

.install-cache: &install-cache
    key:
        prefix: node-modules
        files:
            - yarn.lock
            - package.json
    paths:
        - node_modules/
    policy: pull-push

# Job name has to be `pages`.
pages:
    stage: build
    timeout: 10m
    cache:
        - <<: *install-cache
        - key:
              prefix: content-parser-v1
              files:
                  - yarn.lock
                  - package.json
          paths:
              - .data/content/
          policy: pull-push
    before_script:
        - corepack enable
    script:
        - |
            if [ -x node_modules/.bin/nuxt ]; then
                echo "node_modules cache hit, skipping install"
            else
                yarn install --immutable
            fi
        - |
            # Content checks Markdown changes itself; also invalidate on parser/config changes.
            CONTENT_CACHE_HASH="$(git ls-files -z -- nuxt.config.ts content.config.ts app/utils modules | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)"
            if [ "$(cat .data/content/.ci-parser-hash 2>/dev/null)" != "$CONTENT_CACHE_HASH" ]; then
                echo "Content parser/config changed, clearing content cache"
                rm -rf .data/content
            fi
            mkdir -p .data/content
            printf '%s\n' "$CONTENT_CACHE_HASH" > .data/content/.ci-parser-hash
        - yarn generate
        - mkdir -p public
        - cp -a .output/public/. public/
    pages:
        publish: public
    artifacts:
        paths:
            - public/
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
